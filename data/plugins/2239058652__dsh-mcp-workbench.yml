name: 2239058652/dsh-mcp-workbench
category: tools
description:
  en: MCP management console for DeepSeek Harness — a left-sidebar page that lists every configured MCP server, trial-calls its tools in place, restarts a single row when its transport dies or never synced, and probes reachability.
  zh: DeepSeek Harness 的 MCP 管理控制台：左侧栏独立页面列出全部 MCP 服务器，可就地试用工具；传输断开或工具未同步时可单独重启某一行，并探测连通性。
